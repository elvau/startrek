<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>Reisekasse</title>
<meta name="description" content="Reisekosten planen: Flüge, Unterkünfte, Transport und Attraktionen pro Person, pro Haushalt und gesamt.">
<meta name="theme-color" content="#2F4F8F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reisekasse">

<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1F4; --paper:#FFFFFF; --paper-2:#F6F8FA; --ink:#17243A; --ink-2:#4A5870; --ink-3:#7C889B;
  --line:#D9DFE7; --line-2:#E8ECF1; --accent:#2F4F8F; --accent-soft:#E3E9F5; --shu:#C8452E; --shu-soft:#FBE9E5;
  --good:#3F7A45; --good-soft:#E3F0E2; --warn:#9A6A12; --warn-soft:#F7EDD6;
  --c1:#2F4F8F; --c2:#C8452E; --c3:#3F7A45; --c4:#B7862A; --c5:#7A5AA6;
  --radius:10px; --shadow:0 1px 2px rgba(23,36,58,.06),0 4px 16px rgba(23,36,58,.06);
  --map-sea:#D7E4EE; --map-land:#F3F4EF; --map-coast:#A9B8C6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161F; --paper:#18212D; --paper-2:#1E2836; --ink:#E6EBF2; --ink-2:#AAB5C5; --ink-3:#7F8B9C;
    --line:#2C3848; --line-2:#243040; --accent:#8FAEE8; --accent-soft:#223252; --shu:#F07A62; --shu-soft:#3A2220;
    --good:#86C58A; --good-soft:#1F3322; --warn:#E3B35B; --warn-soft:#3A2F17;
    --c1:#8FAEE8; --c2:#F07A62; --c3:#86C58A; --c4:#E3B35B; --c5:#B79AE0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --map-sea:#131C27; --map-land:#243142; --map-coast:#3A4A5E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161F; --paper:#18212D; --paper-2:#1E2836; --ink:#E6EBF2; --ink-2:#AAB5C5; --ink-3:#7F8B9C;
  --line:#2C3848; --line-2:#243040; --accent:#8FAEE8; --accent-soft:#223252; --shu:#F07A62; --shu-soft:#3A2220;
  --good:#86C58A; --good-soft:#1F3322; --warn:#E3B35B; --warn-soft:#3A2F17;
  --c1:#8FAEE8; --c2:#F07A62; --c3:#86C58A; --c4:#E3B35B; --c5:#B79AE0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --map-sea:#131C27; --map-land:#243142; --map-coast:#3A4A5E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:"Zen Maru Gothic","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input::placeholder{color:var(--ink-3)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:28px;font-weight:900;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.hanko{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--shu);color:var(--shu);font-size:13px;font-weight:900;transform:rotate(-8deg)}
.hanko.fl{font-size:19px;border-color:var(--line);transform:none}
.top p{margin:4px 0 0;color:var(--ink-2)}
.status{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.status.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.status.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}.aside{order:-1}}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.panel-h h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.panel-b{padding:14px 16px}
.sub{color:var(--ink-3);font-size:12.5px}
.cat-total{font-weight:700;font-size:16px}

/* travelers */
.trav{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{display:grid;grid-template-columns:1fr 58px auto;gap:6px;align-items:center;padding:10px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper-2)}
.tcard .hh{grid-column:1 / 3}
.tcard .tag{grid-column:3;justify-self:end}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.adult{background:var(--accent-soft);color:var(--accent)}
.tag.child{background:var(--good-soft);color:var(--good)}
.tag.infant{background:var(--warn-soft);color:var(--warn)}
.x{border:0;background:transparent;color:var(--ink-3);width:28px;height:28px;border-radius:6px;font-size:16px;line-height:1}
.x:hover{background:var(--shu-soft);color:var(--shu)}
.settings{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.field{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
.field input{width:72px;text-align:right}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.ghost{border-style:dashed;color:var(--ink-2)}

/* tiers */
.tiers{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.tier{display:inline-flex;align-items:center;gap:4px;background:var(--paper-2);border:1px solid var(--line-2);border-radius:8px;padding:3px 4px 3px 8px}
.tier input{width:46px;padding:3px 5px;text-align:right;font-size:12.5px}
.tier.on{border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:var(--good-soft)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:4px}

/* items */
.items{display:flex;flex-direction:column}
.item{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.item:last-child{border-bottom:0}
.item.off{opacity:.55}
.row1{display:flex;align-items:center;gap:8px}
.row1 .name{flex:1;font-weight:600}
.row1 .tot{min-width:92px;text-align:right;font-weight:700;font-size:15px}
.toggle{width:18px;height:18px;accent-color:var(--accent);flex:none}
.row2{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.f input{width:92px;text-align:right}
.f input.short{width:62px}
.f input.unit{width:74px;text-align:left}
.f select{padding:6px 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line-2);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
a.pill{text-decoration:none}
.scan-wrap{overflow-x:auto}
table.scan,table.aps{min-width:460px}
table.scan td,table.scan th{text-align:right;padding:5px 6px;white-space:nowrap}
table.scan td:first-child,table.scan th:first-child{text-align:left}
table.scan tr.cheap td{background:var(--good-soft)}
table.scan tr.tip td:first-child b::after{content:" ★";color:var(--warn)}
table.scan tr.muted td{opacity:.7}
table.aps td,table.aps th{text-align:left;padding:4px 6px}
table.aps input{width:100%}
.delta{font-size:11px;margin-left:6px;font-weight:600}
.delta.down{color:var(--good)}.delta.up{color:var(--shu)}
.apanel summary{list-style:none;cursor:pointer}.apanel summary::-webkit-details-marker{display:none}
.apanel:not([open]) summary{border-bottom:0}
.btn.sm{padding:4px 9px;font-size:12px;white-space:nowrap}
table.scan td.acts{display:flex;gap:4px;justify-content:flex-end}
.f input[type=date],.f input[type=datetime-local]{width:auto;text-align:left}
.field input.toggle{width:18px}
.hh-box{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.hh-t td,.hh-t th{white-space:nowrap}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink-2);padding-block:28px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
body.syncing .main{opacity:.75;pointer-events:none}
.loading{flex-wrap:wrap}
.plzin{width:190px}
.sugg{position:fixed;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:4px;max-height:280px;overflow:auto}
.sugg-o{padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font-size:13px}
.sugg-o.on,.sugg-o:hover{background:var(--accent-soft)}
.sugg-o b{display:inline-block;min-width:46px;color:var(--accent)}
.sugg-empty{padding:6px 10px;color:var(--ink-3);font-size:12.5px}
.hhd{border-bottom:1px solid var(--line-2)}
.hhd summary{display:flex;justify-content:space-between;gap:8px;padding:6px 0;cursor:pointer;list-style:none;font-size:13px}
.hhd summary::-webkit-details-marker{display:none}
.hhd-n::before{content:"▸";display:inline-block;width:14px;color:var(--ink-3);transition:transform .15s}
.hhd[open] .hhd-n::before{transform:rotate(90deg)}
.hhd-b{padding:4px 0 10px 14px;display:flex;flex-direction:column;gap:8px}
.bd-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line-2)}
.bd-bar span{display:block;height:100%}
.bd-cat{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.bd-h{display:flex;justify-content:space-between;font-weight:600}
.bd-l{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2);padding-left:18px}
.hhd-sum{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.f input[type=time]{width:auto;text-align:left}
.bd-d{padding-left:28px;font-size:11.5px;color:var(--ink-3)}
.linkbox{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:9px;background:var(--accent-soft)}
.flexbox{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.dual-wrap{display:flex;flex-direction:column;gap:6px}
.dual-head{display:flex;justify-content:space-between;align-items:baseline}
.dual{position:relative;height:28px}
.dual-track,.dual-fill{position:absolute;top:12px;height:6px;border-radius:99px}
.dual-track{left:0;right:0;background:var(--line-2)}
.dual-fill{background:var(--accent)}
.dual input[type=range]{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none;border:0;padding:0}
.dual input[type=range]::-webkit-slider-runnable-track{background:none;height:28px}
.dual input[type=range]::-moz-range-track{background:none}
.dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;border-radius:50%;background:var(--paper);border:3px solid var(--accent);margin-top:3px;cursor:grab}
.dual input[type=range]::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--accent);cursor:grab}
.dual-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
.scanbox{background:var(--paper-2);border-radius:8px;padding:8px 10px}
.fitem{gap:6px}
.fitem.editing{background:color-mix(in srgb,var(--accent-soft) 35%,var(--paper));box-shadow:inset 3px 0 0 var(--accent);gap:10px}
.fname{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:none;border:0;padding:4px 0;text-align:left;font-weight:600;font-size:14.5px;min-width:0}
.fname:hover{color:var(--accent)}
.fname .pill{font-weight:600}
.btn.sm{padding:4px 10px;font-size:12.5px}
.fitem .btn .ico{display:none}
.fsum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding-left:30px}
.fsum.fempty{display:flex;gap:10px;align-items:center}
.froute{display:flex;flex-direction:column;min-width:0}
.froute b{font-size:15px;letter-spacing:.02em}
.plane{color:var(--ink-3);font-weight:400;margin:0 2px}
.fdates{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;justify-content:flex-end;font-variant-numeric:tabular-nums;font-size:13px}
.fdates .arr{color:var(--ink-3)}
.ffacts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-left:30px}
.at-list{display:flex;flex-direction:column}
input.inl{width:46px;padding:1px 4px;text-align:right;display:inline-block}
.at-card .fsum{padding-left:30px}
.at-r{padding:9px 0;border-top:1px dashed var(--line-2)}
.at-r:first-child{border-top:0}
.at-m{display:flex;flex-direction:column;gap:4px;min-width:0}
.at-n{font-weight:600}
.at-add{align-items:center}
.chip[disabled]{opacity:.85;cursor:default}
.tripbar{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.trip-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.trip-chips{flex:1;min-width:0}
.trip-acts{display:flex;flex-wrap:wrap;gap:6px}
.trip-p{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:9px;background:var(--paper-2)}
.trip-p label.chip{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.snap-l{display:flex;flex-direction:column;gap:4px}
.snap-r{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:6px 0;border-top:1px dashed var(--line)}
.snap-a{margin-left:auto;display:inline-flex;gap:10px}
.cmp td,.cmp th{white-space:nowrap}
.cmp-d{display:block;font-size:11px;font-weight:600}.cmp-d.up{color:var(--shu)}.cmp-d.down{color:var(--good)}
.cmp-bars{display:flex;flex-direction:column;gap:5px}
.cmp-b{display:grid;grid-template-columns:minmax(90px,200px) 1fr;gap:8px;align-items:center}
.cmp-b .bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line-2)}
.sharebox{display:flex;flex-direction:column;gap:8px;padding:14px 16px;margin-bottom:14px;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow)}
.legs{display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line-2)}
.legs-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.leg-list{display:flex;flex-direction:column}
.leg-r{display:grid;grid-template-columns:auto 96px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:9px 0;border-top:1px dashed var(--line-2)}
.leg-r:first-child{border-top:0}
.leg-r.off{opacity:.5}
.leg-d{display:flex;flex-direction:column;font-size:13px}
.leg-m{display:flex;flex-direction:column;gap:3px;min-width:0}
.leg-t{font-weight:600}
.leg-p{text-align:right;font-size:14px}
@media (max-width:640px){.leg-r{grid-template-columns:auto minmax(0,1fr) auto}.leg-d{grid-column:2}.leg-m{grid-column:2/-1}.leg-p{grid-column:3;grid-row:1}}
.mapbox{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.map{position:relative;width:100%;max-width:100%;border-radius:9px;overflow:hidden;border:1px solid var(--line-2);background:var(--map-sea);touch-action:none;user-select:none;cursor:grab}
.map.picking{cursor:crosshair;outline:2px solid var(--accent)}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mp-sea{fill:var(--map-sea)}
.mp-land{fill:var(--map-land);stroke:var(--map-coast);stroke-width:1}
.mp-land.o{fill:color-mix(in srgb,var(--map-land) 55%,var(--map-sea));stroke-width:.6}
.mp-line{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:5 4;opacity:.7}
.mp-layer{position:absolute;inset:0;pointer-events:none}
.mp-lm,.mp-pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;white-space:nowrap}
.mp-lm{font-size:10.5px;color:var(--ink-3);transform:translate(-4px,-50%)}
.mp-lm i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);flex:none}
.mp-pin{pointer-events:auto;transform:translate(-7px,-50%);z-index:2}
.mp-pin i{width:14px;height:14px;border-radius:50%;background:var(--pc,var(--accent));border:2px solid var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.35);flex:none}
.mp-pin b{font-size:11px;font-weight:700;background:var(--paper);color:var(--ink);padding:1px 6px;border-radius:99px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mp-pin.k-res i{width:10px;height:10px;background:var(--accent)}
.mp-pin.k-res b{font-weight:600}
.mp-pin.k-res.hot{z-index:3}.mp-pin.k-res.hot b{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.mp-pin.k-cand i{background:var(--paper);border:2px solid var(--accent)}
.mp-pin.k-ap{transform:translate(-50%,40%);z-index:1}.mp-pin.k-ap i{width:0;height:0;border:0;box-shadow:none}.mp-pin.k-ap b{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mp-pin.k-city i{width:8px;height:8px;background:var(--ink-2)}.mp-pin.k-city b{background:transparent;border:0;box-shadow:none;color:var(--ink-2)}
.mp-pin[role=button]{cursor:pointer}
.mp-ctl{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:3px}
.mp-ctl .x{background:var(--paper);border:1px solid var(--line);border-radius:6px;width:28px;height:28px}
.mp-scale{position:absolute;left:8px;bottom:6px;font-size:10.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px;width:60%}
.mp-scale span{height:4px;border:1.5px solid var(--ink-2);border-top:0}
.mp-msg{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--ink-2)}

      const main = accessFor(h.link, ap, 1, days);

        units.forEach(u => { if (!Array.isArray(u.participants)) u.participants = state.travelers.map(x => x.id).filter(id => !ids.includes(id)); else u.participants = u.participants.filter(id => !ids.includes(id)); });
        const nu = newStayFor(sl, ids, f, t);
        state.items.filter(x => x.cat === "stay").forEach(x => { open.delete(x.id); stSearchOpen.delete(x.id); });
        state.items.push(nu); open.add(nu.id); if (mcp) stSearchOpen.add(nu.id);
        render(); scheduleSave(); return;
      }
      case "stToggle": { stSearchOpen.has(id) ? stSearchOpen.delete(id) : stSearchOpen.add(id); render(); return; }
      case "stRun": { if (item) runStaySearch(item); return; }
      case "stType": case "stSort": { if (!item) return; item.sSearch = Object.assign({}, item.sSearch || {}); item.sSearch[b.dataset.act === "stType" ? "type" : "sort"] = b.dataset.v; if (b.dataset.act === "stType" && stRes[id]) delete stRes[id]; break; }
      case "stSrc": { if (!item) return; item.sSearch = Object.assign({booking: true, trivago: true}, item.sSearch || {}); item.sSearch[b.dataset.v] = !item.sSearch[b.dataset.v]; break; }
      case "stApply": { const R = stRes[id]; const r = R && R.list && R.list[+b.dataset.i]; if (!item || !r) return; applyStayResult(item, r, R); break; }
      case "stSave": { const R = stRes[id]; const r = R && R.list && R.list[+b.dataset.i]; if (!item || !r) return;
        item.cands = (item.cands || []).filter(c => c.link !== r.link).concat(Object.assign({}, r, {ppn: R.n && R.nights ? r.total / R.n / R.nights : null, n: R.n, rooms: R.rooms, at: Date.now()})).slice(-12); break; }
      case "candUse": { const r = item && (item.cands || [])[+b.dataset.i]; if (!r) return; applyStayResult(item, r, {n: r.n || stayGuestList(item).length, rooms: r.rooms || 1}); break; }
      case "candDel": { if (!item || !item.cands) return; item.cands.splice(+b.dataset.i, 1); break; }
      case "gapStay": {
        const nu = {id: uid(), cat: "stay", name: "", active: true, mode: "unit", currency: "EUR", adult: "", child: "", infant: "", price: "", capacity: "", qty: 1, unitLabel: "", basis: "total",
          participants: b.dataset.ids ? b.dataset.ids.split(",") : null, ownTier: null, note: "", overflow: "warn", from: b.dataset.from, to: b.dataset.to};
        { const sl = slotAt(b.dataset.from); if (sl){ nu.slot = sl.id; if (sl.from !== nu.from || sl.to !== nu.to) nu.ownDates = true; nu.sSearch = {city: withCountry(sl.city, sl.cc)}; } }
        state.items.filter(x => x.cat === "stay").forEach(x => { open.delete(x.id); stSearchOpen.delete(x.id); });
        state.items.push(nu); open.add(nu.id); stSearchOpen.add(nu.id); render(); scheduleSave();
        const row = $main.querySelector(`[data-item-row="${nu.id}"]`); if (row) row.scrollIntoView({block: "start", behavior: "smooth"});
        return;
      }
      case "allPart": { const it = state.items.find(x => x.id === b.dataset.item); if (it) it.participants = null; break; }
      case "togglePart": {
        const it = state.items.find(x => x.id === b.dataset.item); if (!it) return;
        let parts = Array.isArray(it.participants) ? it.participants.slice() : state.travelers.map(t => t.id);
        parts = parts.includes(id) ? parts.filter(p => p !== id) : parts.concat(id);
        it.participants = parts.length === state.travelers.length ? null : parts;
        break;
      }
      default: return;
    }
    render(); scheduleSave();
  });

  /* ---------- persistence ---------- */
  function isEditing(){ const a = document.activeElement; return a && $main.contains(a) && (a.tagName === "INPUT" || a.tagName === "SELECT"); }
  function setStatus(txt, cls){ $status.textContent = txt; $status.className = "status " + (cls || ""); $status.title = Object.keys(timing).map(k => `${k}: ${(timing[k] / 1000).toFixed(1)} s`).join("\n"); }
  function normalize(d){
    // Snapshots aus der Datenbank sind eingefroren: erst tief kopieren, dann ergänzen
    d = d ? JSON.parse(JSON.stringify(d)) : {};
    const b = blank();
    const out = Object.assign(b, d || {});
    out.settings = Object.assign(blank().settings, (d && d.settings) || {});
    out.tiers = Object.assign({flights: [], stay: [], transport: [], attractions: [], misc: []}, (d && d.tiers) || {});
    out.travelers = Array.isArray(out.travelers) ? out.travelers : [];
    out.items = Array.isArray(out.items) ? out.items : [];
    out.airports = Array.isArray(d && d.airports) && d.airports.length ? d.airports : DEFAULT_AIRPORTS.map(a => Object.assign({}, a));
    if (!(d && d.apV2)){ DEFAULT_AIRPORTS.forEach(def => { const a = out.airports.find(x => String(x.code).toUpperCase() === def.code); if (a) a.def = def.def; else out.airports.push(Object.assign({}, def)); }); out.apV2 = true; }
    out.airports.forEach(a => { const def = DEFAULT_AIRPORTS.find(x => x.code === String(a.code).toUpperCase()); if (def){ ["lat", "lon", "park"].forEach(k => { if (a[k] === undefined) a[k] = def[k]; }); } });
    out.households = (d && d.households && typeof d.households === "object") ? d.households : {};
    out.route = (d && d.route && Array.isArray(d.route.stops)) ? d.route : {stops: []};
    if (!(d && d.meta)){ out.meta = {name: "Japan 2028"}; Object.assign(out.settings, {country: out.settings.country || "JP", countryName: out.settings.countryName || "Japan", dest: out.settings.dest || "TYO", destName: out.settings.destName || "Tokyo"}); }
    // Mehrwährung: "JPY" hieß früher "Landeswährung"; jetzt echte Währungscodes
    if (!out.settings.cur){
      const cc = out.settings.country || "JP", sym = out.settings.locSym;
      out.settings.cur = cc === "JP" ? "JPY" : sym === "€" || !sym ? (PACK_META[cc] && sym !== "€" ? PACK_META[cc][2] : "EUR") : sym === "$" ? "USD" : sym === "฿" ? "THB" : sym === "¥" ? "JPY" : (PACK_META[cc] ? PACK_META[cc][2] : "EUR");
      if (out.settings.cur !== "JPY") out.items.forEach(it => { if (it.currency === "JPY") it.currency = out.settings.cur; });
      if (out.settings.cur === "EUR") out.settings.rate = out.settings.rate || 1;
    }
    return JSON.parse(JSON.stringify(out));
  }
  function scheduleSave(){
    setStatus("Ungespeichert…", "warn");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 700);
  }
  let saving = false, again = false;
  async function save(){
    if (!loaded) return;
    const json = JSON.stringify(state);
    if (!docRef){
      try { localStorage.setItem("reisekasse", json); setStatus("Nur in diesem Browser gespeichert", "warn"); } catch(e){ setStatus("Nicht gespeichert", "warn"); }
      return;
    }
    if (saving){ again = true; return; }
    saving = true;
    try { await docRef.set(JSON.parse(json)); lastSaved = json; cacheWrite(state); setStatus("Gespeichert", "ok"); scheduleMeta(); }
    catch(e){
      if (e && e.code === "unavailable"){ setTimeout(save, 1500 + Math.random() * 1000); }
      else setStatus(e && e.code === "invalid_argument" ? "Nur Lesezugriff" : "Speichern fehlgeschlagen", "warn");
    }
    finally { saving = false; if (again){ again = false; save(); } }
  }
  function applyRemote(d){
    pendingRemote = null;
    const nd = normalize(d); const json = JSON.stringify(nd);
    if (json === JSON.stringify(state)) return;
    state = nd; lastSaved = json; cacheWrite(nd); render();
  }

  const cached = cacheRead();
  if (cached){ state = normalize(cached); fromCache = true; }
  render();
  loadPlz(); loadData(); loadGeo();
  setStatus(cached ? "Zwischenstand, synchronisiere…" : "Verbinde…", "warn");
  setTimeout(() => { if (!loaded){ const el = document.querySelector("[data-slow]"); if (el) el.hidden = false; setStatus("Laden dauert lange…", "warn"); } }, 12000);

  (async () => {
    try { mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null; } catch(e){ mcp = null; }
    mark(mcp ? "Flugsuche bereit" : "Flugsuche nicht verfügbar");
    if (mcp && !isEditing()) render();
  })();

  (async () => {
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ db = null; }
    mark(db ? "Datenbank bereit" : "Datenbank nicht verfügbar");
    if (!db){
      loaded = true; dbMissing = true;
      try { const raw = localStorage.getItem("reisekasse"); if (raw){ state = normalize(JSON.parse(raw)); } } catch(e){}
      render();
      setStatus("Nur in diesem Browser gespeichert", "warn");
      return;
    }
    mark("Datenbank verbunden");
    setStatus(fromCache ? "Zwischenstand, lade aktuelle Daten…" : "Lade Daten…", "warn");
    subscribeTrip();
    const rr = () => { if (!isEditing()) render(); };
    db.collection("tripmeta").onSnapshot(q => { TRIPS = q.docs.map(d => Object.assign({id: d.id}, d.data())); rr(); }, () => {});
    db.collection("snapmeta").onSnapshot(q => { SNAPS = q.docs.map(d => Object.assign({id: d.id}, d.data())); rr(); }, () => {});
  })();
})();
</script>

if ("serviceWorker" in navigator && location.protocol !== "file:") {
