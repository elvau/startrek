<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Split&amp;Fly</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f6f8fc; color: #1d2433; }
    main { text-align: center; padding: 16px; }
    a { color: #2F6FDB; font-weight: 600; word-break: break-all; }
    .dot { display: inline-block; width: 10px; height: 10px; margin: 0 3px; border-radius: 50%; background: #2F6FDB; animation: p 1s infinite alternate; }
    .dot:nth-child(2) { animation-delay: .3s } .dot:nth-child(3) { animation-delay: .6s }
    @keyframes p { to { opacity: .2 } }
    @media (prefers-color-scheme: dark) { body { background: #12161f; color: #e6e9f0; } a { color: #7aa7ff; } }
  </style>
</head>
<body>
  <main id="go"><p aria-busy="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></p></main>
  <script type="module" src="/src/go.ts"></script>
</body>
</html>
