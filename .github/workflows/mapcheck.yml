name: Diagnose Karte (vorläufig)
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, pre-release]
    paths: [scripts/diag/mapcheck.mjs, .github/workflows/mapcheck.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/diag/mapcheck.mjs
