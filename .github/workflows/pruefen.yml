name: Prüfen (vor dem Release)

# Volle Prüfung für jeden Pull Request nach main (Release) und nach pre-release (Arbeit der Routinen): Unit-Tests,
# Typen, Such-Dienst, Sicherheitsregeln und die Ende-zu-Ende-Tests gegen den Firebase-Emulator (in drei Teilen
# nebeneinander). Nach main wird erst gemergt, wenn alles grün ist (docs/RELEASE.md).
on:
  pull_request:
    branches: [main, pre-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests und Typen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: Tests
        working-directory: app
        run: npm test
      - name: Typprüfung
        working-directory: app
        run: npm run check
      - name: Such-Dienst prüfen
        working-directory: worker
        run: npm ci && npx tsc --noEmit && npx wrangler deploy --config ../wrangler.toml --dry-run --outdir /tmp/worker-dist && npx wrangler deploy --dry-run --outdir /tmp/worker-dist-preview
      - name: App bauen
        working-directory: app
        run: npm run build

  regeln:
    name: Sicherheitsregeln (Firestore-Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emu-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: emu-${{ runner.os }}-
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: Sicherheitsregeln
        working-directory: app
        run: npm run test:rules

  # Ende-zu-Ende-Tests in drei Teilen nebeneinander, jeder mit eigenem Emulator (app/playwright.config.mjs)
  e2e:
    name: Ende-zu-Ende ${{ matrix.teil }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Browser für Playwright und Firebase-Emulatoren zwischenspeichern (sonst bei jedem Lauf neu heruntergeladen)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/firebase/emulators
          key: e2e-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: e2e-${{ runner.os }}-
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci && npx playwright install --with-deps chromium
      - name: Ende-zu-Ende-Tests
        working-directory: app
        run: npm run test:cloud -- --shard=${{ matrix.teil }}/3
      # bei Fehlern: Spur, Bildschirmfoto und Seitenzustand je Test (npx playwright show-trace …/trace.zip)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-spuren-${{ matrix.teil }}
          path: app/test-results
          retention-days: 7

  # ein Ergebnis für alles am Emulator (Name wie bisher, für Regeln zum Mergen und die Review-Routine)
  cloud:
    name: Konto und Teilen (Firebase-Emulator)
    runs-on: ubuntu-latest
    needs: [regeln, e2e]
    if: always()
    steps:
      - name: Ergebnis
        run: |
          echo "Sicherheitsregeln: ${{ needs.regeln.result }}, Ende-zu-Ende: ${{ needs.e2e.result }}"
          test "${{ needs.regeln.result }}" = success && test "${{ needs.e2e.result }}" = success
