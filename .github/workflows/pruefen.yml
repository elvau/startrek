name: Prüfen (vor dem Release)

# Volle Prüfung für jeden Pull Request nach main (Release) und nach pre-release (Arbeit der Routinen): Unit-Tests,
# Typen, Such-Dienst, Sicherheitsregeln und die Ende-zu-Ende-Tests gegen den Firebase-Emulator (in vier Teilen
# nebeneinander). Nach main wird erst gemergt, wenn alles grün ist (docs/RELEASE.md).
# Ändert ein Pull Request nur Doku (docs/, *.md), entfallen die Prüfungen; die Checks gelten dann als bestanden.
on:
  pull_request:
    branches: [main, pre-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Was ändert der Pull Request? Nur Doku: nichts zu prüfen. Im Zweifel (Abfrage scheitert, Start von Hand): alles prüfen.
  umfang:
    name: Umfang
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.umfang.outputs.code }}
    steps:
      - id: umfang
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') && [ -n "$files" ]; then
              echo "$files" | grep -qvE '^docs/|\.md$' || code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code geändert: $code"

  build:
    name: Tests und Typen
    needs: umfang
    if: needs.umfang.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/aufbau
        with:
          worker: true
      - name: Tests
        working-directory: app
        run: npm test
      - name: Typprüfung
        working-directory: app
        run: npm run check
      - name: Such-Dienst prüfen
        working-directory: worker
        run: npx tsc --noEmit && npx wrangler deploy --config ../wrangler.toml --dry-run --outdir /tmp/worker-dist && npx wrangler deploy --dry-run --outdir /tmp/worker-dist-preview
      - name: App bauen
        working-directory: app
        run: npm run build

  regeln:
    name: Sicherheitsregeln (Firestore-Emulator)
    needs: umfang
    if: needs.umfang.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/aufbau
        with:
          emulator: true
      - name: Sicherheitsregeln
        working-directory: app
        run: npm run test:rules

  # Ende-zu-Ende-Tests in vier Teilen nebeneinander, jeder mit eigenem Emulator (app/playwright.config.mjs).
  # Die Tests mit Konto laufen je Teil nacheinander: zweigeteilt halbiert sich ihre Kette.
  e2e:
    name: Ende-zu-Ende ${{ matrix.teil }}
    needs: umfang
    if: needs.umfang.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - teil: mit Konto 1/2
            args: --project=konto --shard=1/2
          - teil: mit Konto 2/2
            args: --project=konto --shard=2/2
          - teil: ohne Konto 1/2
            args: --project=lokal --shard=1/2
          - teil: ohne Konto 2/2
            args: --project=lokal --shard=2/2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/aufbau
        with:
          emulator: true
          browser: true
      - name: Ende-zu-Ende-Tests
        working-directory: app
        run: npm run test:cloud -- ${{ matrix.args }}
      # bei Fehlern: Spur, Bildschirmfoto und Seitenzustand je Test (npx playwright show-trace …/trace.zip)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-spuren-${{ strategy.job-index }}
          path: app/test-results
          retention-days: 7

  # ein Ergebnis für alles am Emulator (Name wie bisher, für Regeln zum Mergen und die Review-Routine)
  cloud:
    name: Konto und Teilen (Firebase-Emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [umfang, regeln, e2e]
    if: always()
    steps:
      - name: Ergebnis
        env:
          CODE: ${{ needs.umfang.outputs.code }}
          UMFANG: ${{ needs.umfang.result }}
          REGELN: ${{ needs.regeln.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "Umfang: $UMFANG (Code geändert: $CODE), Sicherheitsregeln: $REGELN, Ende-zu-Ende: $E2E"
          test "$UMFANG" = success
          if [ "$CODE" = false ]; then echo "Nur Doku geändert: nichts zu prüfen."; exit 0; fi
          test "$REGELN" = success && test "$E2E" = success
