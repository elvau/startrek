name: Prüfen (vor dem Release)

# Volle Prüfung für jeden Pull Request nach main: Unit-Tests, Typen, Such-Dienst, Sicherheitsregeln und die
# Ende-zu-Ende-Tests gegen den Firebase-Emulator. Erst wenn alles grün ist, wird gemergt (docs/RELEASE.md).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests und Typen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: Tests
        working-directory: app
        run: npm test
      - name: Typprüfung
        working-directory: app
        run: npm run check
      - name: Such-Dienst prüfen
        working-directory: worker
        run: npm ci && npx tsc --noEmit && npx wrangler deploy --config ../wrangler.toml --dry-run --outdir /tmp/worker-dist && npx wrangler deploy --dry-run --outdir /tmp/worker-dist-preview
      - name: App bauen
        working-directory: app
        run: npm run build

  cloud:
    name: Konto und Teilen (Firebase-Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci && npx playwright install --with-deps chromium
      - name: Sicherheitsregeln
        working-directory: app
        run: npm run test:rules
      - name: Zwei Personen planen gemeinsam
        working-directory: app
        run: npm run test:cloud
