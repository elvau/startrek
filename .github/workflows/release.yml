name: Release (splitandfly.com)

# Produktion: jeder Push auf main (Merge eines Feature-Branches) landet auf splitandfly.com (Firebase Hosting).
# Feature-Branches gehen nur in die Testumgebung (pages.yml). Anleitung: docs/RELEASE.md
on:
  push:
    branches: [main]
  workflow_dispatch:
  # jede Woche neu bauen, damit die Flughafendaten aktuell bleiben
  schedule:
    - cron: "17 3 * * 1"

permissions:
  # write: Tag und Release-Seite für die neue Version anlegen
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: produktion
      url: https://splitandfly.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Zugang zu Firebase vorhanden?
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT fehlt (siehe docs/RELEASE.md)"; exit 1; fi
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: Tests
        working-directory: app
        run: npm test
      - name: Typprüfung
        working-directory: app
        run: npm run check
      - name: App bauen
        working-directory: app
        run: npm run build
        env:
          BASE: /
          # Firebase-Konfiguration (auch die Anmelde-Domain splitandfly.com) kommt aus app/.env.production
      - name: Flughafendaten aktualisieren
        run: node scripts/airports.mjs || echo "::warning::Flughafendaten nicht aktualisiert, alte Datei bleibt"
      - name: Seite zusammenstellen
        run: scripts/site.sh app/_hosting
      - name: Auf splitandfly.com veröffentlichen
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: startrek-1b6a7
          channelId: live
          entryPoint: app
      # neue Version in app/package.json → Tag vX.Y.Z und Release-Seite mit den Änderungen seit der letzten Version.
      # Gleiche Version wie beim letzten Mal (z. B. wöchentlicher Neubau): nichts zu tun.
      - name: Version als Tag und Release
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./app/package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "$V gibt es schon, kein neues Release"
          else
            gh release create "$V" --target "$GITHUB_SHA" --title "Split&Fly ${V#v} (Beta)" --generate-notes --prerelease
          fi
