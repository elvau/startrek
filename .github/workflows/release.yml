name: Release (splitandfly.com)

# Produktion: jeder Push auf main (Merge des Release-PRs) geht als eine Kette live, jede Stufe wartet auf die vorige:
#   Prüfen (Unit, Typen) → Firestore-Regeln → Such-Dienst (Cloudflare) → App (Firebase Hosting) → Rauchtest → Tag
# Scheitert eine Stufe, bleiben die folgenden stehen. Regeln und Such-Dienst gehen mit Absicht vor der App live (die
# neue App trifft nie auf alte Regeln oder einen alten Dienst): scheitert danach die App, läuft die alte App gegen die
# neuen Regeln und den neuen Dienst, bis der Lauf wiederholt ist. Beide müssen deshalb zur vorigen App passen.
# Nur von main: ein von Hand gestarteter Lauf auf einem anderen Branch veröffentlicht nichts.
# Feature-Branches gehen nur in die Testumgebung (pages.yml). Anleitung: docs/RELEASE.md
on:
  push:
    branches: [main]
  workflow_dispatch:
  # jede Woche neu bauen, damit die Flughafendaten aktuell bleiben (nur die App, ohne Regeln, Such-Dienst und Tag)
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PROJEKT: startrek-1b6a7
  SEITE: https://splitandfly.com
  DIENST: https://startrek.danielbednorz1990.workers.dev

jobs:
  pruefen:
    name: Prüfen (Unit, Typen)
    # alle weiteren Stufen hängen an dieser: auf einem anderen Branch läuft keine
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Zugang zu Firebase vorhanden?
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT fehlt (siehe docs/RELEASE.md)"; exit 1; fi
      - uses: ./.github/actions/aufbau
      - name: Tests
        working-directory: app
        run: npm test
      - name: Typprüfung
        working-directory: app
        run: npm run check

  # Regeln zuerst: die neue App darf nie auf alte Regeln treffen, die ihr etwas verbieten
  regeln:
    name: Firestore-Regeln
    needs: pruefen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule'
      - uses: ./.github/actions/aufbau
        if: github.event_name != 'schedule'
      - name: Regeln einspielen
        if: github.event_name != 'schedule'
        working-directory: app
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          printf '%s' "$SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase deploy --only firestore:rules --project "$PROJEKT" --non-interactive
      - name: Zugang wieder löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  # Such-Dienst vor der App: neue Endpunkte sind da, bevor die App sie aufruft
  dienst:
    name: Such-Dienst (Cloudflare)
    needs: regeln
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      stand: ${{ steps.deploy.outputs.stand }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule'
      - name: Zugang zu Cloudflare vorhanden?
        id: zugang
        if: github.event_name != 'schedule'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KONTO: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$KONTO" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen: Such-Dienst nicht aus GitHub veröffentlicht, das übernimmt weiter Cloudflare Workers Builds (#697)"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/aufbau
        if: steps.zugang.outputs.ok == '1'
        with:
          app: false
          worker: true
      - name: Veröffentlichen
        id: deploy
        if: steps.zugang.outputs.ok == '1'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # --env "": der Dienst der Produktion (oberste Ebene der wrangler.toml), nicht die Umgebung „test“
          # STAND: der Commit, /health meldet ihn (Rauchtest)
          npx wrangler deploy --config ../wrangler.toml --env "" --var "STAND:$GITHUB_SHA"
          echo "stand=neu" >> "$GITHUB_OUTPUT"

  app:
    name: App (splitandfly.com)
    needs: dienst
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: produktion
      url: https://splitandfly.com
    outputs:
      start: ${{ steps.bau.outputs.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/aufbau
      - name: App bauen
        id: bau
        working-directory: app
        run: |
          npm run build
          # Start-Chunk dieses Stands: daran erkennt der Rauchtest, dass genau er ausgeliefert wird
          echo "start=$(grep -o 'assets/main-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"
        env:
          BASE: /
          # Firebase-Konfiguration (auch die Anmelde-Domain splitandfly.com) kommt aus app/.env.production
      - name: Flughafendaten aktualisieren
        run: node scripts/airports.mjs || echo "::warning::Flughafendaten nicht aktualisiert, alte Datei bleibt"
      - name: Einreisedaten aktualisieren
        # Passport Index Data (MIT); klappt das nicht, bleibt public/visa.json aus dem Projekt
        run: node scripts/visa.mjs || echo "::warning::Einreisedaten nicht aktualisiert, alte Datei bleibt"
      - name: Sportkalender aktualisieren
        # Formel 1 (Jolpica) und große Sportevents (Wikidata); klappt das nicht, bleibt public/sports.json, wie sie ist
        run: node scripts/sports.mjs || echo "::warning::Sportkalender nicht aktualisiert"
      - name: Seite zusammenstellen
        run: scripts/site.sh app/_hosting
      - name: Auf splitandfly.com veröffentlichen
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: startrek-1b6a7
          channelId: live
          entryPoint: app

  # Antwortet der neue Stand? Seite und Such-Dienst müssen die Version aus app/package.json melden.
  rauchtest:
    name: Rauchtest
    needs: [dienst, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Seite und Such-Dienst
        # hat GitHub den Such-Dienst selbst veröffentlicht, muss er die neue Version melden; sonst (Cloudflare
        # Workers Builds, läuft unabhängig) nur ein Hinweis
        run: node scripts/rauchtest.mjs "$SEITE" "$DIENST" "--start=${{ needs.app.outputs.start }}" ${{ github.event_name == 'schedule' && '--nur-seite' || '' }} ${{ needs.dienst.outputs.stand == 'neu' && format('--stand={0}', github.sha) || '--dienst-nachsichtig' }}

  # neue Version in app/package.json → Tag vX.Y.Z und Release-Seite mit den Änderungen seit der letzten Version.
  # Gleiche Version wie beim letzten Mal: nichts zu tun. Nicht beim wöchentlichen Neubau.
  tag:
    name: Version als Tag und Release
    needs: rauchtest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./app/package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "$V gibt es schon, kein neues Release"
          else
            gh release create "$V" --target "$GITHUB_SHA" --title "Split&Fly ${V#v} (Beta)" --generate-notes --prerelease
          fi
