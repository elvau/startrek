name: Reisehinweise erzeugen
# Hinweise für Frauen, Passeintrag „X“ und LGBTQ+ aus offenen Quellen (scripts/hinweise.mjs). Ergebnis nur als
# Vorschlag im Log (Belege je Land, am Ende das JSON): Einstufung prüfen, dann public/hinweise.json von Hand übernehmen.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, pre-release]
    paths: [scripts/hinweise.mjs, .github/workflows/hinweise.yml]
permissions:
  contents: read
jobs:
  hinweise:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aufbau
        with:
          app: false
      - run: node scripts/hinweise.mjs
