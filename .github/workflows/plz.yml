name: Postleitzahlen erzeugen
# Postleitzahlen europäischer Länder aus GeoNames (scripts/plz.mjs, #163). Ergebnis auf dem Hilfs-Branch „daten/plz“
# (nur app/public/plz/): prüfen und von dort in den Arbeits-Branch übernehmen. Läuft von Hand und bei Änderungen am Skript.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, pre-release]
    paths: [scripts/plz.mjs, .github/workflows/plz.yml]
permissions:
  contents: write
jobs:
  plz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/aufbau
        with:
          app: false
      - name: GeoNames laden
        run: |
          mkdir -p /tmp/zip && cd /tmp/zip
          for cc in $(grep "^export const EUROPE" "$GITHUB_WORKSPACE/scripts/plz.mjs" | grep -o '"[A-Z][A-Z]"' | tr -d '"'); do
            curl -sfL -o "$cc.zip" "https://download.geonames.org/export/zip/$cc.zip" && unzip -oq "$cc.zip" "$cc.txt" || echo "$cc fehlt"
          done
          ls
      - run: node scripts/plz.mjs /tmp/zip
      - name: Auf daten/plz ablegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B daten/plz
          git add app/public/plz
          git commit -qm "Postleitzahlen aus GeoNames (scripts/plz.mjs)"
          git push -qf origin daten/plz
