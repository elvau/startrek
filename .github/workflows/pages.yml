name: Testumgebung (GitHub Pages)

# Jeder Push auf einen Feature-Branch: nur bauen und schnell auf die Testumgebung (elvau.github.io/startrek/).
# Die volle Prüfung (Tests, Typen, Such-Dienst, Emulator) läuft beim Pull Request nach main (pruefen.yml).
# main geht nicht hierher, sondern nach splitandfly.com (release.yml). Anleitung: docs/RELEASE.md
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: App bauen
        working-directory: app
        run: npm run build
        env:
          # Testumgebung: elvau.github.io/startrek/ (splitandfly.com kommt aus release.yml)
          BASE: /${{ github.event.repository.name }}/
          # Firebase-Konfiguration kommt aus app/.env.production
      - name: Flughafendaten aktualisieren
        # neue Daten von OurAirports; klappt das nicht, bleibt public/airports.json aus dem Projekt
        run: node scripts/airports.mjs || echo "::warning::Flughafendaten nicht aktualisiert, alte Datei bleibt"
      - name: Seite zusammenstellen
        run: scripts/site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # mehrere Branches: nacheinander veröffentlichen, der zuletzt gepushte steht am Ende auf der Testumgebung
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
