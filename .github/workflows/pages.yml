name: Testumgebung (GitHub Pages)

# Jeder Push auf pre-release: nur bauen und schnell auf die Testumgebung (elvau.github.io/startrek/), ohne Prüfung.
# Arbeits-Branches landen dort erst, wenn sie in pre-release gemergt werden; die volle Prüfung (Tests, Typen,
# Such-Dienst, Emulator) läuft bei Pull Requests (pruefen.yml). main geht nach splitandfly.com (release.yml).
# Daneben wird der Such-Dienst der Testumgebung veröffentlicht (startrek-test), sobald der Zugang zu Cloudflare
# eingerichtet ist (#697). Anleitung: docs/RELEASE.md
on:
  push:
    branches: [pre-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Such-Dienst der Testumgebung: läuft neben dem Bau der Seite, damit sie schnell steht.
  dienst:
    name: Such-Dienst (startrek-test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Zugang zu Cloudflare vorhanden?
        id: zugang
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KONTO: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$KONTO" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen: Such-Dienst der Testumgebung nicht veröffentlicht (#697)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/aufbau
        if: steps.zugang.outputs.skip != '1'
        with:
          app: false
          worker: true
      - name: Veröffentlichen
        if: steps.zugang.outputs.skip != '1'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Bildspeicher der Testumgebung: anlegen, falls es ihn noch nicht gibt
          npx wrangler r2 bucket create splitandfly-bugs-test >/dev/null 2>&1 || true
          npx wrangler deploy --config ../wrangler.toml --env test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aufbau
      - name: App bauen
        working-directory: app
        env:
          # Testumgebung: elvau.github.io/startrek/ (splitandfly.com kommt aus release.yml)
          BASE: /${{ github.event.repository.name }}/
          # Firebase: eigenes Testprojekt aus app/.env.staging, nie das echte (app/.env.production)
          # Such-Dienst: der der Produktion (app/.env.staging), bis die Variable TEST_DIENST im Repo auf „an“ steht
          # (Settings → Secrets and variables → Actions → Variables); dann der eigene der Testumgebung
          TEST_DIENST: ${{ vars.TEST_DIENST }}
          TEST_DIENST_URL: https://startrek-test.danielbednorz1990.workers.dev
        run: |
          if [ "$TEST_DIENST" = an ]; then export VITE_FLIGHTS_URL="$TEST_DIENST_URL"; echo "Such-Dienst: $TEST_DIENST_URL"; fi
          npm run build:test
      - name: Flughafendaten aktualisieren
        # neue Daten von OurAirports; klappt das nicht, bleibt public/airports.json aus dem Projekt
        run: node scripts/airports.mjs || echo "::warning::Flughafendaten nicht aktualisiert, alte Datei bleibt"
      - name: Einreisedaten aktualisieren
        # Passport Index Data (MIT); klappt das nicht, bleibt public/visa.json aus dem Projekt
        run: node scripts/visa.mjs || echo "::warning::Einreisedaten nicht aktualisiert, alte Datei bleibt"
      - name: Sportkalender aktualisieren
        # Formel 1 (Jolpica) und große Sportevents (Wikidata); klappt das nicht, bleibt public/sports.json, wie sie ist
        # höchstens 30 s (Wikidata ist manchmal langsam): die Testumgebung soll schnell stehen
        run: timeout 30 node scripts/sports.mjs || echo "::warning::Sportkalender nicht aktualisiert"
      - name: Seite zusammenstellen
        run: scripts/site.sh _site test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # mehrere Branches: nacheinander veröffentlichen, der zuletzt gepushte steht am Ende auf der Testumgebung
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
