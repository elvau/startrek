name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # jede Woche neu bauen, damit die Flughafendaten aktuell bleiben
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: Tests
        working-directory: app
        run: npm test
      - name: Typprüfung
        working-directory: app
        run: npm run check
      - name: Such-Dienst prüfen
        working-directory: worker
        run: npm ci && npx tsc --noEmit && npx wrangler deploy --config ../wrangler.toml --dry-run --outdir /tmp/worker-dist && npx wrangler deploy --dry-run --outdir /tmp/worker-dist-preview
      - name: Neue App bauen
        working-directory: app
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/neu/
          # Firebase-Konfiguration kommt aus app/.env.production
      - name: Flughafendaten aktualisieren
        # neue Daten von OurAirports; klappt das nicht, bleibt public/airports.json aus dem Projekt
        run: node scripts/airports.mjs || echo "::warning::Flughafendaten nicht aktualisiert, alte Datei bleibt"
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r public/. _site/
          mkdir -p _site/neu
          cp -r app/dist/. _site/neu/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  cloud:
    name: Konto und Teilen (Firebase-Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci && npx playwright install --with-deps chromium
      - name: Sicherheitsregeln
        working-directory: app
        run: npm run test:rules
      - name: Zwei Personen planen gemeinsam
        working-directory: app
        run: npm run test:cloud

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, cloud]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
