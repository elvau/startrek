name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: Tests
        working-directory: app
        run: npm test
      - name: Typprüfung
        working-directory: app
        run: npm run check
      - name: Neue App bauen
        working-directory: app
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/neu/
          # Firebase-Zugangsdaten als Repository-Variablen (Settings → Secrets and variables → Actions → Variables).
          # Fehlen sie, läuft die App nur lokal ohne Konto.
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r public/. _site/
          mkdir -p _site/neu
          cp -r app/dist/. _site/neu/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  cloud:
    name: Konto und Teilen (Firebase-Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci && npx playwright install --with-deps chromium
      - name: Sicherheitsregeln
        working-directory: app
        run: npm run test:rules
      - name: Zwei Personen planen gemeinsam
        working-directory: app
        run: npm run test:cloud

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, cloud]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
