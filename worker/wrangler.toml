# Gleicher Such-Dienst wie in ../wrangler.toml, für Builds mit Root directory „worker“
# (die Vorschau-Builds von Cloudflare für Pull Requests starten in diesem Ordner).
# Änderungen bitte in beiden Dateien gleich halten.
name = "startrek"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Variablen, die im Dashboard angelegt wurden, beim Veröffentlichen nicht löschen
keep_vars = true

[observability]
enabled = true

# täglich 03:17 UTC: abgelaufene Einträge des Angebotsspeichers löschen (worker/src/offers.ts, #462)
[triggers]
crons = ["17 3 * * *"]

[vars]
ALLOWED_ORIGINS = "https://elvau.github.io,https://splitandfly.com,https://www.splitandfly.com,https://startrek-1b6a7.web.app,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
# Partnerkennung bei Travelpayouts (öffentlich, steht ohnehin in jedem Aviasales-Link)
TRAVELPAYOUTS_MARKER = "783080"
# Firebase-Projekt der Testumgebung: Anmeldungen von dort gelten als „test:<uid>“ (docs/FIREBASE.md, Testprojekt)
FIREBASE_TEST_PROJECT_ID = "startrek-test-b792b"
# die Admin-Ansicht liest aus dem Datensatz, in den dieser Dienst schreibt (unten, analytics_engine_datasets)
USAGE_DATASET = "splitandfly_usage_test"

# Bildspeicher für Fehlermeldungen, wie in ../wrangler.toml
[[r2_buckets]]
binding = "BUG_BUCKET"
bucket_name = "splitandfly-bugs"

# Nutzung für die Admin-Ansicht, wie in ../wrangler.toml
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "splitandfly_usage"

# Such-Dienst der Testumgebung („startrek-test“, #696): gleicher Code, eigener Worker mit eigenen Schlüsseln, eigenem
# Bildspeicher und eigener Zählung. pages.yml veröffentlicht ihn bei jedem Push auf pre-release
# (npx wrangler deploy --env test). Variablen und Bindungen erbt eine Umgebung nicht: sie stehen hier noch einmal,
# bitte mit den Angaben oben gleich halten. Der tägliche Zeitplan (triggers) gilt auch hier.
[env.test]
name = "startrek-test"

[env.test.vars]
ALLOWED_ORIGINS = "https://elvau.github.io,https://splitandfly.com,https://www.splitandfly.com,https://startrek-1b6a7.web.app,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
TRAVELPAYOUTS_MARKER = "783080"
FIREBASE_TEST_PROJECT_ID = "startrek-test-b792b"

[[env.test.r2_buckets]]
binding = "BUG_BUCKET"
bucket_name = "splitandfly-bugs-test"

[[env.test.analytics_engine_datasets]]
binding = "USAGE"
dataset = "splitandfly_usage_test"
