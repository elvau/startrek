# Such-Dienst der Reisekasse (Cloudflare Worker „startrek“). Code in worker/, Anleitung in docs/FLUGSUCHE.md.
# Liegt bewusst im Hauptordner: Cloudflare baut mit Root directory „/“ und findet so direkt den Dienst
# (ohne diese Datei erkennt Wrangler den Ordner app/ als statische Seite und lädt dessen Quelldateien hoch).
name = "startrek"
main = "worker/src/index.ts"
compatibility_date = "2026-09-01"
# Variablen, die im Dashboard angelegt wurden, beim Veröffentlichen nicht löschen
keep_vars = true

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://elvau.github.io,https://splitandfly.com,https://www.splitandfly.com,https://startrek-1b6a7.web.app,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
# Partnerkennung bei Travelpayouts (öffentlich, steht ohnehin in jedem Aviasales-Link)
TRAVELPAYOUTS_MARKER = "783080"

# Gleiche Einstellungen stehen in worker/wrangler.toml (für Vorschau-Builds mit Root „worker“), bitte gleich halten.
# Schlüssel der Anbieter als Secrets im Cloudflare-Dashboard, nicht hier:
#   TRAVELPAYOUTS_TOKEN, GEMINI_API_KEY (KI-Planer), TICKETMASTER_KEY, FOOTBALL_DATA_KEY (Event-Suche), VIATOR_API_KEY (Touren und Tickets), später DUFFEL_TOKEN (immer Typ „Secret“, sonst löscht ein neues Veröffentlichen sie)
# KI-Planer optional: GEMINI_MODEL (Standard gemini-3.8-flash), GEMINI_FALLBACK_MODEL (springt bei Überlastung ein), AGENT_DAILY (Anfragen pro Tag, Standard 5)
# Fehler melden (Beta, docs/BUGS.md): Secret GITHUB_TOKEN, Variable BUG_REPO (privates Repo), optional BUG_DAILY (Standard 5).
# Bildspeicher (R2-Bucket, löscht per Lifecycle-Regel nach 30 Tagen); der Bucket muss existieren, sonst schlägt das Veröffentlichen fehl
[[r2_buckets]]
binding = "BUG_BUCKET"
bucket_name = "splitandfly-bugs"

# Nutzung der kostenlosen Kontingente für die Admin-Ansicht (worker/src/usage.ts): anonyme Zählung in Analytics Engine.
# Lesen braucht Variable CF_ACCOUNT_ID, Secret CF_API_TOKEN (nur „Account Analytics: Read“), Variable ADMIN_UIDS (Firebase-UIDs).
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "splitandfly_usage"
