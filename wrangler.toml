# Such-Dienst der Reisekasse (Cloudflare Worker „startrek“). Code in worker/, Anleitung in docs/FLUGSUCHE.md.
# Liegt bewusst im Hauptordner: Cloudflare baut mit Root directory „/“ und findet so direkt den Dienst
# (ohne diese Datei erkennt Wrangler den Ordner app/ als statische Seite und lädt dessen Quelldateien hoch).
name = "startrek"
main = "worker/src/index.ts"
compatibility_date = "2026-09-01"
# Variablen, die im Dashboard angelegt wurden, beim Veröffentlichen nicht löschen
keep_vars = true

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://elvau.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
# Partnerkennung bei Travelpayouts (öffentlich, steht ohnehin in jedem Aviasales-Link)
TRAVELPAYOUTS_MARKER = "783080"

# Gleiche Einstellungen stehen in worker/wrangler.toml (für Vorschau-Builds mit Root „worker“), bitte gleich halten.
# Schlüssel der Anbieter als Secrets im Cloudflare-Dashboard, nicht hier:
#   TRAVELPAYOUTS_TOKEN, später DUFFEL_TOKEN (immer Typ „Secret“, sonst löscht ein neues Veröffentlichen sie)
